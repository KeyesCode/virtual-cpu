# Local services for the research engine: PostgreSQL 16 and Redis 7. The research worker stays on
# the host (docs/research-engine/architecture.md, "Sandbox boundary"), and no service here gets the
# Docker socket. Both ports bind to 127.0.0.1 only. Run it from the repository root:
#
#   docker compose --env-file .env -f infrastructure/docker/compose.yml up -d postgres redis
#
# Compose reads .env from this file's directory unless --env-file names the root one.
name: silicon-lab-research

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research}
      POSTGRES_DB: ${POSTGRES_DB:-research}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction; the append-only file keeps queued jobs across restarts.
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
